<svg viewBox="0 0 1200 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
