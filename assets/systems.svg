<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <pattern id="sysGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#101d30" stroke-width="1"/>
    </pattern>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#sysBg)"/>
  <rect width="1200" height="420" fill="url(#sysGrid)" opacity="0.5"/>

  <text x="40" y="36" font-family="'Courier New', monospace" font-size="12" letter-spacing="3" fill="#4a6178">MODULE://ENGINEERING-SYSTEMS</text>

  <!-- connecting lines: hub -> nodes -->
  <g stroke="#1c3a54" stroke-width="1.6">
    <line x1="600" y1="210" x2="600" y2="95"  stroke-dasharray="5 6"><animate attributeName="stroke-dashoffset" values="0;-22" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="600" y1="210" x2="985" y2="178" stroke-dasharray="5 6"><animate attributeName="stroke-dashoffset" values="0;-22" dur="2.3s" repeatCount="indefinite"/></line>
    <line x1="600" y1="210" x2="838" y2="318" stroke-dasharray="5 6"><animate attributeName="stroke-dashoffset" values="0;-22" dur="2.9s" repeatCount="indefinite"/></line>
    <line x1="600" y1="210" x2="362" y2="318" stroke-dasharray="5 6"><animate attributeName="stroke-dashoffset" values="0;-22" dur="2.5s" repeatCount="indefinite"/></line>
    <line x1="600" y1="210" x2="215" y2="178" stroke-dasharray="5 6"><animate attributeName="stroke-dashoffset" values="0;-22" dur="3.1s" repeatCount="indefinite"/></line>
  </g>

  <!-- hub -->
  <circle cx="600" cy="210" r="64" fill="url(#hubGlow)"/>
  <circle cx="600" cy="210" r="46" fill="#0a0e17" stroke="#00d9ff" stroke-width="1.6"/>
  <circle cx="600" cy="210" r="46" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="46;56;46" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="1" fill="#e2e8f0" font-weight="700">CORE</text>
  <text x="600" y="221" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#7c8ba0">SAM</text>

  <!-- node: AI (top) -->
  <g>
    <rect x="475" y="62" width="250" height="52" rx="6" fill="#0a0e17" stroke="#1c3a54" stroke-width="1.4"/>
    <circle cx="494" cy="88" r="3.5" fill="#00d9ff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
    <text x="508" y="84" font-family="'Courier New', monospace" font-size="10" fill="#4a6178">DOMAIN[0]</text>
    <text x="508" y="100" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#e2e8f0">AI &amp; MACHINE LEARNING</text>
  </g>

  <!-- node: COMPUTER VISION (upper right) -->
  <g>
    <rect x="890" y="152" width="220" height="52" rx="6" fill="#0a0e17" stroke="#1c3a54" stroke-width="1.4"/>
    <circle cx="909" cy="178" r="3.5" fill="#00d9ff"><animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <text x="923" y="174" font-family="'Courier New', monospace" font-size="10" fill="#4a6178">DOMAIN[1]</text>
    <text x="923" y="190" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#e2e8f0">COMPUTER VISION</text>
  </g>

  <!-- node: ROBOTICS (lower right) -->
  <g>
    <rect x="748" y="292" width="180" height="52" rx="6" fill="#0a0e17" stroke="#1c3a54" stroke-width="1.4"/>
    <circle cx="767" cy="318" r="3.5" fill="#00d9ff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
    <text x="781" y="314" font-family="'Courier New', monospace" font-size="10" fill="#4a6178">DOMAIN[2]</text>
    <text x="781" y="330" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#e2e8f0">ROBOTICS</text>
  </g>

  <!-- node: SOFTWARE ENGINEERING (lower left) -->
  <g>
    <rect x="272" y="292" width="220" height="52" rx="6" fill="#0a0e17" stroke="#1c3a54" stroke-width="1.4"/>
    <circle cx="291" cy="318" r="3.5" fill="#00d9ff"><animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="305" y="314" font-family="'Courier New', monospace" font-size="10" fill="#4a6178">DOMAIN[3]</text>
    <text x="305" y="330" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#e2e8f0">SOFTWARE ENGINEERING</text>
  </g>

  <!-- node: AI SECURITY (upper left) -->
  <g>
    <rect x="90" y="152" width="200" height="52" rx="6" fill="#0a0e17" stroke="#1c3a54" stroke-width="1.4"/>
    <circle cx="109" cy="178" r="3.5" fill="#00d9ff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite"/></circle>
    <text x="123" y="174" font-family="'Courier New', monospace" font-size="10" fill="#4a6178">DOMAIN[4]</text>
    <text x="123" y="190" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#e2e8f0">AI SECURITY</text>
  </g>

  <line x1="40" y1="392" x2="1160" y2="392" stroke="#16283f" stroke-width="1"/>
  <text x="40" y="410" font-family="'Courier New', monospace" font-size="10" letter-spacing="1" fill="#3a4d63">FIVE ACTIVE DOMAINS — ONE ENGINEER</text>
</svg>
