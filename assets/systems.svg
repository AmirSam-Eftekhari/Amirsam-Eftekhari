<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering systems: AI and Machine Learning, Computer Vision, Robotics, Software Engineering, AI Security" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="blurLg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blurMd" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.4"/><stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B3A55" stop-opacity="0.85"/><stop offset="100%" stop-color="#1B3A55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="#0A0E17"/>
  <circle cx="260" cy="100" r="180" fill="url(#blobA)" filter="url(#blurLg)"/>
  <circle cx="940" cy="320" r="200" fill="url(#blobB)" filter="url(#blurLg)"/>
  <circle cx="900" cy="90" r="140" fill="url(#blobA)" filter="url(#blurMd)"/>

  <!-- connector lines: trimmed to run edge-to-edge (hub boundary -> card boundary), never through hub or card interiors -->
  <g stroke="#00D9FF" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="552.2" y1="195.2" x2="370" y2="139"/>
    <line x1="647.8" y1="195.2" x2="830" y2="139"/>
    <line x1="551.8" y1="223.5" x2="370" y2="274.3"/>
    <line x1="648.2" y1="223.5" x2="830" y2="274.3"/>
  </g>
  <line x1="600" y1="260" x2="600" y2="378" stroke="#00D9FF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- edge connector nodes -->
  <circle cx="370" cy="139" r="4" fill="#00D9FF"/>
  <circle cx="830" cy="139" r="4" fill="#00D9FF"/>
  <circle cx="370" cy="274.3" r="4" fill="#00D9FF"/>
  <circle cx="830" cy="274.3" r="4" fill="#00D9FF"/>

  <!-- hub -->
  <circle cx="600" cy="210" r="50" fill="url(#cardFill)" stroke="#FFFFFF" stroke-opacity="0.16"/>
  <circle cx="600" cy="210" r="50" fill="none" stroke="#00D9FF" stroke-opacity="0.3"/>
  <text x="600" y="205" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="12" fill="#E6F1FF" letter-spacing="1">SAM</text>
  <text x="600" y="221" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="12" fill="#00D9FF" letter-spacing="1">NIA</text>

  <g>
    <rect x="150" y="70" width="220" height="70" rx="20" fill="url(#cardFill)" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="150" y="70" width="220" height="70" rx="20" fill="none" stroke="#00D9FF" stroke-opacity="0.18"/>
    <text x="164" y="90" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#5E7A99" letter-spacing="1">DOMAIN[0]</text>
    <text x="164" y="113" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#E6F1FF" font-weight="600">AI &amp; MACHINE LEARNING</text>
  </g>

  <g>
    <rect x="830" y="70" width="220" height="70" rx="20" fill="url(#cardFill)" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="830" y="70" width="220" height="70" rx="20" fill="none" stroke="#00D9FF" stroke-opacity="0.18"/>
    <text x="844" y="90" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#5E7A99" letter-spacing="1">DOMAIN[1]</text>
    <text x="844" y="113" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#E6F1FF" font-weight="600">COMPUTER VISION</text>
  </g>

  <g>
    <rect x="150" y="270" width="220" height="70" rx="20" fill="url(#cardFill)" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="150" y="270" width="220" height="70" rx="20" fill="none" stroke="#00D9FF" stroke-opacity="0.18"/>
    <text x="164" y="290" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#5E7A99" letter-spacing="1">DOMAIN[2]</text>
    <text x="164" y="313" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#E6F1FF" font-weight="600">ROBOTICS</text>
  </g>

  <g>
    <rect x="830" y="270" width="220" height="70" rx="20" fill="url(#cardFill)" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="830" y="270" width="220" height="70" rx="20" fill="none" stroke="#00D9FF" stroke-opacity="0.18"/>
    <text x="844" y="290" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#5E7A99" letter-spacing="1">DOMAIN[3]</text>
    <text x="844" y="313" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#E6F1FF" font-weight="600">SOFTWARE ENGINEERING</text>
  </g>

  <g>
    <rect x="490" y="378" width="220" height="34" rx="17" fill="url(#cardFill)" stroke="#00D9FF" stroke-opacity="0.35" stroke-dasharray="3 3"/>
    <text x="600" y="399" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="12" fill="#00D9FF" letter-spacing="2">+ AI SECURITY</text>
  </g>
</svg>
