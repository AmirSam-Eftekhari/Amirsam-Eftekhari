<svg viewBox="0 0 260 44" width="220" height="37" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System status: online" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <radialGradient id="blob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="260" height="44" fill="#0A0E17"/>
  <circle cx="40" cy="22" r="40" fill="url(#blob)" filter="url(#blur)"/>
  <rect x="2" y="2" width="256" height="40" rx="20" fill="url(#fill)" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <rect x="2" y="2" width="256" height="40" rx="20" fill="none" stroke="#00D9FF" stroke-opacity="0.2"/>
  <circle cx="24" cy="22" r="5" fill="#00D9FF">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="27" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#8FA3BF" letter-spacing="1">SYSTEM STATUS: <tspan fill="#00D9FF" font-weight="700">ONLINE</tspan></text>
</svg>
