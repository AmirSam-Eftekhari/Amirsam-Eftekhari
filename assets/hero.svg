<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="55%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d9ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#122036" stroke-width="1"/>
    </pattern>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>

  <!-- horizontal scanline sweep -->
  <rect x="0" y="-6" width="1200" height="4" fill="url(#scanGrad)" filter="url(#softBlur)">
    <animate attributeName="y" values="-6;326;-6" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g stroke="#00d9ff" stroke-width="2" opacity="0.65" fill="none">
    <path d="M 24 16 L 24 40 M 24 16 L 48 16"/>
    <path d="M 1176 16 L 1176 40 M 1176 16 L 1152 16"/>
    <path d="M 24 304 L 24 280 M 24 304 L 48 304"/>
    <path d="M 1176 304 L 1176 280 M 1176 304 L 1152 304"/>
  </g>

  <!-- top status strip -->
  <text x="60" y="46" font-family="'Courier New', monospace" font-size="12" letter-spacing="3" fill="#4a6178">SYS://AMIRSAM-EFTEKHARI</text>
  <text x="1140" y="46" text-anchor="end" font-family="'Courier New', monospace" font-size="12" letter-spacing="2" fill="#4a6178">UNIT-01</text>

  <!-- title -->
  <text x="58" y="172" font-family="'Courier New', monospace" font-size="92" font-weight="700" fill="#f2f6fa">SAM</text>
  <text x="64" y="206" font-family="'Courier New', monospace" font-size="19" letter-spacing="5" fill="#00d9ff">AI · ROBOTICS · COMPUTER VISION</text>
  <text x="64" y="238" font-family="'Courier New', monospace" font-size="14" font-style="italic" fill="#7c8ba0">"Building intelligent systems that interact with the real world."</text>

  <!-- blinking cursor -->
  <rect x="64" y="248" width="9" height="14" fill="#00d9ff">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- node network cluster, top-right -->
  <g>
    <line x1="880" y1="90" x2="960" y2="60" stroke="#1c3a54" stroke-width="1.5" stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="880" y1="90" x2="940" y2="140" stroke="#1c3a54" stroke-width="1.5" stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.1s" repeatCount="indefinite"/>
    </line>
    <line x1="960" y1="60" x2="1050" y2="80" stroke="#1c3a54" stroke-width="1.5" stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.8s" repeatCount="indefinite"/>
    </line>
    <line x1="940" y1="140" x2="1050" y2="80" stroke="#1c3a54" stroke-width="1.5" stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="940" y1="140" x2="1020" y2="170" stroke="#1c3a54" stroke-width="1.5" stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="1050" y1="80" x2="1120" y2="130" stroke="#1c3a54" stroke-width="1.5" stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.2s" repeatCount="indefinite"/>
    </line>

    <g>
      <circle cx="880" cy="90" r="14" fill="url(#nodeGlow)"/>
      <circle cx="880" cy="90" r="4" fill="#00d9ff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
    <g>
      <circle cx="960" cy="60" r="14" fill="url(#nodeGlow)"/>
      <circle cx="960" cy="60" r="4" fill="#00d9ff"><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <g>
      <circle cx="940" cy="140" r="14" fill="url(#nodeGlow)"/>
      <circle cx="940" cy="140" r="4" fill="#00d9ff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>
    <g>
      <circle cx="1050" cy="80" r="14" fill="url(#nodeGlow)"/>
      <circle cx="1050" cy="80" r="4" fill="#00d9ff"><animate attributeName="opacity" values="1;0.4;1" dur="2.3s" repeatCount="indefinite"/></circle>
    </g>
    <g>
      <circle cx="1020" cy="170" r="14" fill="url(#nodeGlow)"/>
      <circle cx="1020" cy="170" r="4" fill="#00d9ff"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
    </g>
    <g>
      <circle cx="1120" cy="130" r="14" fill="url(#nodeGlow)"/>
      <circle cx="1120" cy="130" r="4" fill="#00d9ff"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- bottom thin rule with ticks -->
  <line x1="60" y1="284" x2="1140" y2="284" stroke="#16283f" stroke-width="1"/>
</svg>
