<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sam Nia — AI, Computer Vision, Robotics, Software Engineering" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="blurLg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="blurMd" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="35"/></filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="blobCyan1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobNavy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B3A55" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1B3A55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panelClip">
      <rect x="120" y="30" width="960" height="220" rx="36"/>
    </clipPath>
  </defs>

  <rect width="1200" height="280" fill="#0A0E17"/>

  <circle cx="230" cy="60" r="160" fill="url(#blobCyan1)" filter="url(#blurLg)"/>
  <circle cx="1000" cy="230" r="180" fill="url(#blobNavy)" filter="url(#blurLg)"/>
  <circle cx="750" cy="40" r="120" fill="url(#blobCyan2)" filter="url(#blurMd)"/>

  <rect x="130" y="44" width="960" height="220" rx="36" fill="#000000" opacity="0.35" filter="url(#softShadow)"/>

  <rect x="120" y="30" width="960" height="220" rx="36" fill="url(#panelFill)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>
  <rect x="120" y="30" width="960" height="220" rx="36" fill="none" stroke="#00D9FF" stroke-opacity="0.18" stroke-width="1"/>

  <g clip-path="url(#panelClip)">
    <ellipse cx="260" cy="10" rx="320" ry="90" fill="url(#highlight)"/>
  </g>

  <g>
    <rect x="938" y="50" width="118" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#00D9FF" stroke-opacity="0.4"/>
    <circle cx="956" cy="65" r="4" fill="#00D9FF">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="968" y="69" font-family="SFMono-Regular, Consolas, monospace" font-size="11" fill="#8FA3BF" letter-spacing="1.5">ONLINE</text>
  </g>

  <text x="600" y="150" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="56" fill="#E6F1FF" letter-spacing="8">SAM <tspan fill="#00D9FF">NIA</tspan></text>

  <text x="600" y="188" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="14" fill="#8FA3BF" letter-spacing="3">AI · COMPUTER VISION · ROBOTICS · SOFTWARE ENGINEERING</text>

  <text x="600" y="218" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="11" fill="#4A6178" letter-spacing="1">SYSTEM://SAM-NIA</text>
</svg>
